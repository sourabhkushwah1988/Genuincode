services:
  - type: web
    name: genuincode-web
    region: oregon
    env: python
    pythonVersion: "3.11.6"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn admin.wsgi:application"
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: DJANGO_SETTINGS_MODULE
        value: admin.settings
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
